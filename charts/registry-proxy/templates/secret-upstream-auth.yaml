{{- if and .Values.upstreamAuth.enabled (not .Values.upstreamAuth.existingSecret) -}}
{{- $dockerConfigJSON := include "registry-proxy.upstreamAuthConfig" . -}}
{{- $dockerConfig := fromJson $dockerConfigJSON -}}
{{- if not (and $dockerConfig (hasKey $dockerConfig "auths")) -}}
{{- fail "the Docker config JSON must contain an auths object" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "registry-proxy.upstreamAuthSecretName" . }}
  labels:
    {{- include "registry-proxy.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerConfigJSON | b64enc | quote }}
{{- end }}
