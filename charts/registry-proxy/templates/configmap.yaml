{{- if and .Values.config.registryMapping (not .Values.config.existingRegistryMappingConfigMap) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "registry-proxy.fullname" . }}
  labels:
    {{- include "registry-proxy.labels" . | nindent 4 }}
data:
  registry-mapping.yaml: |
    {{- toYaml .Values.config.registryMapping | nindent 4 }}
{{- end }}
