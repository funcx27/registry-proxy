replicaCount: 1

image:
  # Image produced by the build-image workflow.
  repository: ghcr.io/funcx27/registry-proxy
  # Defaults to Chart.appVersion when empty.
  tag: ""
  # When set, takes precedence over tag, for example sha256:...
  digest: ""
  pullPolicy: IfNotPresent

# Secrets used by kubelet to pull the registry-proxy image itself.
# Example:
# imagePullSecrets:
#   - name: private-registry-credentials
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

# Kubernetes injects <SERVICE>_HOST and <SERVICE>_PORT variables for every
# Service in the namespace when this is true. Disable it to keep the registry
# pod environment small and to avoid collisions with upstream variables.
enableServiceLinks: false

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  # Optional fixed ClusterIP, useful when /etc/hosts entries must remain stable.
  # The address must be unused and inside the cluster service CIDR.
  # clusterIP is immutable after the Service is created; changing it requires
  # deleting and recreating the Service.
  clusterIP: ""
  # Main plain-HTTP port. The chart always also exposes port 443 on the same
  # HTTP backend so clients that probe HTTPS first fail fast and retry over HTTP.
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: registry.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls:
  #   - secretName: registry-proxy-tls
  #     hosts:
  #       - registry.example.com

persistence:
  # Storage backend for /var/lib/registry:
  #   hostPath - data lives on the node, easy to inspect and back up.
  #   pvc      - Kubernetes PersistentVolumeClaim, recommended for multi-node clusters.
  #   emptyDir - ephemeral data, deleted when the pod is removed.
  type: hostPath

  hostPath:
    # The registry writes to /var/lib/registry inside the container; this path is
    # the corresponding directory on the host. It must be absolute. Use a unique
    # path for each release when running multiple instances on the same node.
    path: /var/lib/registry-proxy
    type: DirectoryOrCreate

  # Used when type=pvc. Set to an existing claim to skip PVC creation.
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  annotations: {}

# Upstream registry credentials used by regclient while proxying private images.
#
# The selected Secret must contain a Docker config JSON document. It is mounted
# read-only and REGISTRY_AUTH_FILE is pointed at the selected key, so regclient can
# authenticate to every upstream registry listed under "auths".
#
# For production, prefer an existing Secret managed by an external secret store.
# For convenience, register one or more registries below with username/password;
# the chart renders them into a Docker config JSON Secret.
#
# When existingSecret is set, it takes precedence and no Secret is generated.
# Otherwise configure only one of registries, dockerconfigjson, or
# dockerConfigFile.
upstreamAuth:
  enabled: false
  # Existing Secret containing Docker config JSON under the standard
  # .dockerconfigjson key. When set, no Secret is generated and the other
  # credential inputs are ignored.
  existingSecret: ""
  # Directory where the Secret is mounted. REGISTRY_AUTH_FILE points at
  # <mountPath>/.dockerconfigjson.
  mountPath: /etc/registry-proxy/auth
  # Convenient values-based credentials. The map key is the registry server
  # exactly as it should appear in Docker config, for example:
  #
  # registries:
  #   registry.example.com:
  #     username: robot
  #     password: secret
  #
  # For Docker Hub, use https://index.docker.io/v1/ as the key.
  registries: {}
  # Optional raw Docker config JSON used to create the Secret when existingSecret
  # and registries are empty. Supply it from a file:
  #
  #   --set-file upstreamAuth.dockerconfigjson=$HOME/.docker/config.json
  #
  dockerconfigjson: ""
  # Optional path to a Docker config JSON file packaged inside the chart, for
  # example files/config.json. Helm's .Files.Get can only read files inside the
  # chart package, not arbitrary paths on the host.
  #
  # The file is embedded in the chart archive. Use this only for CI or
  # non-sensitive environments; do not commit real credentials or publish a
  # chart containing them.
  dockerConfigFile: ""

# Registry routing table. The application reads
# <storage rootdirectory>/registry-mapping.yaml by default, which is
# /var/lib/registry/registry-mapping.yaml for the container image.
#
# Keys are registry domains or repository namespaces. The proxy accepts three
# equivalent client forms and normalizes all of them to the same local
# repository:
#
#   path:  /v2/ghcr.io/org/app/manifests/v1
#   host:  Host: ghcr.io + /v2/org/app/manifests/v1
#   ns:    /v2/org/app/manifests/v1?ns=ghcr.io
#
# Host mode also works without a mapping when the Host header is a DNS name:
# the Host becomes the upstream registry. IP addresses and single-label hosts
# stay local, so use one of those (not the fully qualified Service name) for
# direct access to the local registry.
#
# Domain keys use registry semantics: /v2/docker.io/alpine is copied from
# docker.io/library/alpine. Namespace keys preserve the upstream path:
# /v2/dockerhub/alpine/socat is copied from <registry>/dockerhub/alpine/socat.
# Set preservePath explicitly to override that default.
#
# For a domain key, registry may include a repository prefix. The key's first
# path component is stripped before the prefix is applied, so
# ghcr.io: {registry: upstream.example.com/ghcr.io} copies /v2/ghcr.io/org/app
# from upstream.example.com/ghcr.io/org/app.
#
# Routing precedence: a registry domain in the first path component, an
# explicit Host mapping, an explicit first-component mapping, ?ns=, the
# automatic Host fallback, then a plain local request. A Host mapping wins over
# a namespace mapping with the same first path component.
#
# docker.io uses the conventional "library" namespace for single-component
# repositories such as docker.io/alpine.
#
# registry optionally points at a different upstream host, or at another proxy
# with a repository prefix. Leave it empty to use the map key itself. Namespace
# mappings normally need an explicit registry because the key is not a hostname.
config:
  registryMapping:
    docker.io:
      defaultNamespace: library
    ghcr.io: {}
    registry.k8s.io: {}
    quay.io: {}
  # Mount an existing ConfigMap instead of generating one. It must contain the
  # registry-mapping.yaml key.
  existingRegistryMappingConfigMap: ""

# Periodic tag cleanup job executed by the application.
imageClean:
  enabled: true
  interval: 12h
  # Number of newest tags to retain per repository; must be at least 1.
  retainTags: 2
  # Comma-separated list of top-level repository namespaces to clean.
  # Leave empty to clean every repository under the local registry.
  project: ""
  beforeDays: 1

env:
  timezone: Asia/Shanghai
  # Level of distribution's internal registry logger.
  logLevel: error
  # Level of registry-proxy's own logger (pull progress, cleanup, ...).
  appLogLevel: info
  # sync waits for the copy before proxying; async copies in the background;
  # off disables on-demand copying and serves the local registry only. Even in
  # off mode, path/host/ns requests normalize to the same local repository.
  imageCopyMode: sync
  imagePullTimeout: 5m
  imagePullWorkers: 2
  # 0 keeps producers backpressured until a worker is free. Use a small
  # positive value only when bursts should wait in a short in-memory queue.
  imagePullQueueSize: 0
  imageRepullMinInterval: 5m
  # Extra environment variables. Each item supports the normal Kubernetes env form.
  extra: []

# Recreate avoids two pods competing for a ReadWriteOnce data volume.
deploymentStrategy:
  type: Recreate

livenessProbe:
  enabled: true
  httpGet:
    path: /v2/
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

readinessProbe:
  enabled: true
  httpGet:
    path: /v2/
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  enabled: true
  httpGet:
    path: /v2/
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 24

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
terminationGracePeriodSeconds: 30

extraVolumes: []
extraVolumeMounts: []
