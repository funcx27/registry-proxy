version: 0.1
log:
  fields:
    service: registry
  accesslog:
    disabled: true
  level: error
storage:
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
  tag:
    concurrencylimit: 8
http:
  addr: :80
  # pprof and metrics are enabled by default on 127.0.0.1 with a kernel-assigned
  # port; the startup log reports the real URL. Set DEBUG_ADDR=off to disable
  # them, or DEBUG_ADDR=127.0.0.1:6060 to pin a port. The equivalent YAML form
  # below is honored when DEBUG_ADDR is unset:
  # debug:
  #   addr: 127.0.0.1:6060
  #   prometheus:
  #     enabled: false
  #     path: /metrics
  headers:
    X-Content-Type-Options: [nosniff]
# auth:
#   htpasswd:
#     realm: basic-realm
#     path: /etc/registry
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
validation:
  manifests:
    indexes:
      # Pull-through cache stores the top-level index first and fills child
      # manifests on demand, so the registry must accept incomplete indexes.
      platforms: none
