version: 0.1
log:
  fields:
    service: registry
  accesslog:
    disabled: true
  level: error
storage:
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
  tag:
    concurrencylimit: 8
http:
  addr: :80
  headers:
    X-Content-Type-Options: [nosniff]
# auth:
#   htpasswd:
#     realm: basic-realm
#     path: /etc/registry
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
validation:
  manifests:
    indexes:
      # Pull-through cache stores the top-level index first and fills child
      # manifests on demand, so the registry must accept incomplete indexes.
      platforms: none
