name: Build and Release

on:
  push:
    branches:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            project_version="${GITHUB_REF_NAME#v}"
            image_version="${project_version}"
          else
            branch="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
            if [[ ! "${branch}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::Image builds must run from a v<major>.<minor>[.<patch>] branch or a v<major>.<minor>.<patch> tag"
              exit 1
            fi
            project_version="${branch#v}"
            if [[ "${branch}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
              project_version="${project_version}.0"
            fi
            image_version="${project_version}-dev.${GITHUB_SHA::12}"
          fi

          distribution_version="$(go list -m -f '{{.Version}}' github.com/distribution/distribution/v3)"
          {
            echo "project_version=${project_version}"
            echo "image_version=${image_version}"
            echo "distribution_version=${distribution_version#v}"
          } >> "${GITHUB_OUTPUT}"

      - name: Test
        run: go test ./...

      - name: Build binaries
        env:
          PROJECT_VERSION: ${{ steps.metadata.outputs.project_version }}
          DISTRIBUTION_VERSION: ${{ steps.metadata.outputs.distribution_version }}
          GIT_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p bin dist
          cp config.yml bin/config.yml

          ldflags="-s -w \
            -X registry-proxy/pkg/version.Version=${PROJECT_VERSION} \
            -X registry-proxy/pkg/version.Revision=${GIT_REVISION} \
            -X registry-proxy/pkg/version.DistributionVersion=${DISTRIBUTION_VERSION}"

          go build \
            -trimpath \
            -ldflags="${ldflags}" \
            -o bin/registry-amd64 .

          GOOS=linux GOARCH=arm64 go build \
            -trimpath \
            -ldflags="${ldflags}" \
            -o bin/registry-arm64 .

          ./bin/registry-amd64 --version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        env:
          IMAGE_VERSION: ${{ steps.metadata.outputs.image_version }}
          DISTRIBUTION_VERSION: ${{ steps.metadata.outputs.distribution_version }}
        run: |
          set -euo pipefail

          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          outputs=(
            "--output" "type=oci,dest=dist/registry-proxy-oci.tar"
          )

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            outputs+=(
              "--output" "type=registry,ref=${image_repository}:${IMAGE_VERSION}"
            )
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --tag "${image_repository}:${IMAGE_VERSION}" \
            --label "org.opencontainers.image.version=${IMAGE_VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "io.github.funcx27.upstream.distribution.version=${DISTRIBUTION_VERSION}" \
            "${outputs[@]}" \
            bin

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: registry-proxy-oci-${{ steps.metadata.outputs.image_version }}
          path: dist/registry-proxy-oci.tar
          if-no-files-found: error
          retention-days: 7

  chart:
    name: Lint and package Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      chart_version: ${{ steps.metadata.outputs.chart_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Resolve chart version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          chart_version="$(awk '$1 == "version:" { print $2; exit }' charts/registry-proxy/Chart.yaml)"
          app_version="$(awk '$1 == "appVersion:" { gsub(/"/, "", $2); print $2; exit }' charts/registry-proxy/Chart.yaml)"

          # Release charts use the application tag, so the asset name and
          # appVersion stay aligned with the published container image.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            chart_version="${GITHUB_REF_NAME#v}"
            app_version="${chart_version}"
          fi

          {
            echo "chart_version=${chart_version}"
            echo "app_version=${app_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Lint and package chart
        env:
          CHART_VERSION: ${{ steps.metadata.outputs.chart_version }}
          CHART_APP_VERSION: ${{ steps.metadata.outputs.app_version }}
        run: |
          set -euo pipefail
          make chart-package

          chart_package="dist/registry-proxy-${CHART_VERSION}.tgz"
          test -f "${chart_package}"

          # The CI fixtures contain sample credentials and must never ship.
          if tar -tzf "${chart_package}" | grep -q '/ci/'; then
            echo "::error::chart package unexpectedly contains ci/ fixtures"
            exit 1
          fi

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: registry-proxy-chart-${{ steps.metadata.outputs.chart_version }}
          path: dist/registry-proxy-*.tgz
          if-no-files-found: error
          retention-days: 7

  chart-publish:
    name: Publish Helm chart to GHCR
    if: github.ref_type == 'tag'
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download chart artifact
        uses: actions/download-artifact@v4
        with:
          name: registry-proxy-chart-${{ needs.chart.outputs.chart_version }}
          path: dist

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart as OCI artifact
        env:
          CHART_VERSION: ${{ needs.chart.outputs.chart_version }}
        run: |
          set -euo pipefail
          chart_package="dist/registry-proxy-${CHART_VERSION}.tgz"
          chart_repository="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          helm push "${chart_package}" "${chart_repository}"
