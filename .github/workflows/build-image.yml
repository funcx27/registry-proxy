name: Build Image

on:
  push:
    branches:
      - "v[0-9]+.[0-9]+"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - "v[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            branch="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
            if [[ ! "${branch}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Image builds must run from a v<major>.<minor> branch or a v<major>.<minor>.<patch> tag"
              exit 1
            fi
            version="${branch#v}.0-dev.${GITHUB_SHA::12}"
          fi

          distribution_version="$(go list -m -f '{{.Version}}' github.com/distribution/distribution/v3)"
          {
            echo "image_version=${version}"
            echo "distribution_version=${distribution_version#v}"
          } >> "${GITHUB_OUTPUT}"

      - name: Test
        run: go test -tags="containers_image_openpgp exclude_graphdriver_btrfs" ./...

      - name: Build binaries
        run: |
          set -euo pipefail

          mkdir -p bin dist
          cp config.yml bin/config.yml

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -tags="containers_image_openpgp exclude_graphdriver_btrfs" \
            -o bin/registry-amd64 .

          GOOS=linux GOARCH=arm64 go build \
            -trimpath \
            -ldflags="-s -w" \
            -tags="containers_image_openpgp exclude_graphdriver_btrfs" \
            -o bin/registry-arm64 .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI image archive
        env:
          IMAGE_VERSION: ${{ steps.metadata.outputs.image_version }}
          DISTRIBUTION_VERSION: ${{ steps.metadata.outputs.distribution_version }}
        run: |
          set -euo pipefail

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --tag "registry-proxy:${IMAGE_VERSION}" \
            --label "org.opencontainers.image.version=${IMAGE_VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "io.github.funcx27.upstream.distribution.version=${DISTRIBUTION_VERSION}" \
            --output type=oci,dest=dist/registry-proxy-oci.tar \
            bin

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: registry-proxy-oci-${{ steps.metadata.outputs.image_version }}
          path: dist/registry-proxy-oci.tar
          if-no-files-found: error
          retention-days: 7
