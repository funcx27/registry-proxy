name: Build Image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -tags="containers_image_openpgp exclude_graphdriver_btrfs" ./...

      - name: Build binaries
        run: |
          set -euo pipefail

          mkdir -p bin dist
          cp config.yml bin/config.yml

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -tags="containers_image_openpgp exclude_graphdriver_btrfs" \
            -o bin/registry-amd64 .

          GOOS=linux GOARCH=arm64 go build \
            -trimpath \
            -ldflags="-s -w" \
            -tags="containers_image_openpgp exclude_graphdriver_btrfs" \
            -o bin/registry-arm64 .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI image archive
        run: |
          set -euo pipefail

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --tag registry-proxy:ci \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --output type=oci,dest=dist/registry-proxy-oci.tar \
            bin

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: registry-proxy-oci-${{ github.sha }}
          path: dist/registry-proxy-oci.tar
          if-no-files-found: error
          retention-days: 7
