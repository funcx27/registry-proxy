version: "2"

# v2 默认启用 standard 集合：errcheck、govet、ineffassign、staticcheck、unused。
# 这里只追加 standard 之外的 linter。
linters:
  enable:
    - bodyclose
    - misspell
    - prealloc
    - revive
    - tparallel
    - unconvert
  settings:
    revive:
      rules:
        # TODO(thaJeztah): temporarily disabled the "unused-parameter" check.
        # It produces many warnings, and some of those may need to be looked at.
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - (^|/)vendor/

# v2 把格式化器从 linters 中拆了出来，gofmt/goimports 在这里配置。
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - (^|/)vendor/
